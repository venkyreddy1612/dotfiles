# ── Environment ──────────────────────────────────────
$terminal = kitty
$browser = flatpak run app.zen_browser.zen
$mod = SUPER

# ── Monitor ──────────────────────────────────────────
monitor = DP-1, 3440x1440@200, 0x0, 1
monitor = eDP-1, disable

# ── Input ────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# ── General ──────────────────────────────────────────
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(7aa2f7ff)
    col.inactive_border = rgba(414868ff)
    layout = master
    resize_on_border = true
}

# ── Decoration ───────────────────────────────────────

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}
# ── Animations ───────────────────────────────────────
animations {
    enabled = true
}

# ── Window behavior ──────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
}


# Rofi transparency and blur
layerrule {
    name = rofi-blur
    match:namespace = rofi
    blur = true
}
# ── Autostart ────────────────────────────────────────
exec-once = kitty


# ── Tiling Layout Change ────────────────────────────────────────
# Switch tiling layouts
bind = SUPER, D, exec, hyprctl keyword general:layout dwindle
bind = SUPER, A, exec, hyprctl keyword general:layout master

# Toggle floating for the focused window
bind = SUPER, V, togglefloating

# ── Applications ─────────────────────────────────────
bind = $mod, RETURN, exec, $terminal
bind = $mod, B, exec, $browser
bind = $mod, E, exec, kitty -e yazi
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, M, exit
bind = $mod, R, exec, rofi -show drun -theme ~/dotfiles/rofi/.config/rofi/themes/tokyo-night.rasi

# ── Focus ────────────────────────────────────────────
bind = $mod, LEFT, movefocus, l
bind = $mod, RIGHT, movefocus, r
bind = $mod, UP, movefocus, u
bind = $mod, DOWN, movefocus, d

# ── Workspaces ───────────────────────────────────────
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
