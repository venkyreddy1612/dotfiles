add_newline = false

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$character"""

[username]
show_always = true

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
